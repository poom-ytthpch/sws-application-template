name: Microservice CI/CD Secure Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-secure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-size: '18.x'

      - name: Install dependencies & Compile
        run: |
          npm ci
          npm run build

      - name: Scan Image using Trivy Operator
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-registry/nestjs-api:${{ github.ref_name }}'
          format: 'table'
          exit-code: '1' # Fail the pipeline on critical CVE discoveries
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Cosign signing stub configurations
      - name: Install Cosign CLI
        uses: sigstore/cosign-installer@main
        with:
          cosign-release: 'v2.0.0'

      - name: Sign Image Digest
        run: |
          echo "Signing image digest..."
          # cosign sign --key cosign.key my-registry/nestjs-api:${{ github.ref_name }}
